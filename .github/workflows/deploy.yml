name: Build and deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  # Rebuild daily so finished shows move from Upcoming to Past
  # (assets/js/events.js also does this in the browser).
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Upload and deploy run in separate jobs on purpose: when they run back to
  # back in one job, deploy-pages can intermittently fail to find the
  # artifact (https://github.com/actions/deploy-pages/issues/451).
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the sitemap can use each page's real last-modified date
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build
        run: node scripts/build.mjs
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
